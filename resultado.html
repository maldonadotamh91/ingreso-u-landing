main{flex:1;max-width:760px;margin:0 auto;width:100%;padding:40px 20px 60px;display:flex;flex-direction:column;gap:36px}

.scale-marker{position:absolute;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;background:var(--an);border:3px solid white;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.25)}

.scale-edges{display:flex;justify-content:space-between;margin-top:6px}
.scale-edge{font-size:11px;color:var(--ts);font-weight:600}
.scale-mid{font-size:11px;color:var(--ts);font-weight:600;position:absolute;left:50%;transform:translateX(-50%);margin-top:6px}

function fmt(n){return n.toLocaleString('es-MX')}

function scorePct(s){return Math.round((s-700)/600*100)}

function renderPage(){
  const params = new URLSearchParams(window.location.hash.slice(1));
  const slug = params.get('fac');
  const fac = FACULTADES[slug];
  const content = document.getElementById('pageContent');

  if(!fac){
    content.innerHTML = `
      <div class="error-wrap">
        <h2>Facultad no encontrada</h2>
        <p>El enlace no es válido. Regresa a la lista de facultades y elige la tuya.</p>
        <a href="facultad.html">� � Ir a facultades</a>
      </div>`;
    return;
  }

  document.title = fac.nombre + ' � Ingreso U';
  document.documentElement.style.setProperty('--area-color', fac.areaColor);

  const minScore = Math.min(...fac.programas.map(p=>p.score));
  const maxScore = Math.max(...fac.programas.map(p=>p.score));
  const hasMultiple = fac.programas.length > 1;
  const displayScore = hasMultiple ? minScore : fac.programas[0].score;
  const pct = scorePct(displayScore);
  const midPct = scorePct(1000);

  const progRows = fac.programas.map(p=>`
    <tr>
      <td>${p.nombre}</td>
      <td class="pts">${fmt(p.score)}</td>
    </tr>`).join('');

  const progSection = hasMultiple ? `
    <div class="card-title">Puntajes por carrera</div>
    <table class="prog-table">
      <thead><tr><th>Carrera</th><th>Puntaje mínimo</th></tr></thead>
      <tbody>${progRows}</tbody>
    </table>` : '';

  const allSecs = [
    ...MODULOS_BASE.map((m,i)=>({name:m,num:i+1,q:30,type:'base'})),
    ...fac.modulos.map((m,i)=>({name:m,num:MODULOS_BASE.length+i+1,q:24,type:'spec'}))
  ];
  const secCards = allSecs.map(s=>{
    const info = MODULO_INFO[s.name]||{desc:''};
    return `<div class="exam-sec">
      <div class="exam-sec-num${s.type==='spec'?' spec':''}">${s.num}</div>
      <div class="exam-sec-body">
        <div class="exam-sec-name">${s.name}</div>
        <div class="exam-sec-desc">${info.desc}</div>
      </div>
      <div class="exam-sec-qs">${s.q} preg.</div>

function calcGap(cutoff){
  const val = parseInt(document.getElementById('myScore').value);
  const result = document.getElementById('gapResult');
  if(!val || val < 700 || val > 1300){
    result.className = 'gap-result show far';
    result.innerHTML = 'Ingresa un puntaje válido entre 700 y 1,300.';
    return;
  }
  const diff = cutoff - val;
  if(diff <= 0){
    result.className = 'gap-result show ok';
    result.innerHTML = `¡Ya tienes el puntaje mínimo!<span class="gap-num">+${fmt(Math.abs(diff))} pts de ventaja</span>Estás ${fmt(Math.abs(diff))} puntos por encima del mínimo requerido.`;
  } else if(diff <= 60){
    result.className = 'gap-result show close';
    result.innerHTML = `Estás muy cerca.<span class="gap-num">${fmt(diff)} pts de diferencia</span>Con un poco más de preparación en los módulos específicos puedes lograrlo.`;
  } else {
    result.className = 'gap-result show far';
    result.innerHTML = `Te faltan ${fmt(diff)} puntos.<span class="gap-num">${fmt(diff)} pts de diferencia</span>Nuestro diagnóstico gratuito te indica exactamente qué repasar para cerrar esa brecha.`;
  }
}
