<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tu diagnóstico — Ingreso U</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --am:#FFC000;
  --az:#0049E3;
  --an:#161C4D;
  --bl:#FFFFFF;
  --ts:#5A5F7A;
  --li:rgba(0,0,0,.08);
  --area-color:#EF4444;
}
body{font-family:'Montserrat',sans-serif;background:#F7F8FC;min-height:100vh;display:flex;flex-direction:column}

/* NAV */
nav{background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-bottom:3px solid var(--am);padding:12px 28px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
.nl{font-family:'Oswald',sans-serif;font-size:21px;font-weight:700;color:var(--an);text-transform:uppercase;letter-spacing:.04em;text-decoration:none}
.nl em{color:var(--am);font-style:normal}
.nav-back{margin-left:auto;font-size:12px;font-weight:600;color:var(--ts);text-decoration:none;display:flex;align-items:center;gap:6px}
.nav-back:hover{color:var(--az)}

/* PAGE HEADER */
.pg-header{background:white;border-bottom:1px solid var(--li);padding:36px 24px 32px;text-align:center}
.paso{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ts);margin-bottom:14px}
.area-chip{display:inline-flex;align-items:center;gap:7px;background:rgba(0,0,0,.04);border-radius:20px;padding:5px 14px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ts);margin-bottom:14px}
.area-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--area-color)}
h1{font-family:'Oswald',sans-serif;font-size:clamp(26px,5vw,48px);font-weight:700;text-transform:uppercase;color:var(--an);line-height:1.08;margin-bottom:0}
h1 em{color:var(--am);font-style:normal}

/* MAIN */
main{flex:1;max-width:760px;margin:0 auto;width:100%;padding:40px 20px 60px;display:flex;flex-direction:column;gap:36px}

/* CARD */
.card{background:white;border:1.5px solid var(--li);border-radius:16px;padding:28px 24px}
.card-title{font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ts);margin-bottom:18px;display:flex;align-items:center;gap:8px}
.card-title::before{content:'';display:block;width:3px;height:16px;background:var(--am);border-radius:2px;flex-shrink:0}

/* SCORE SECTION */
.score-hero{text-align:center;margin-bottom:28px}
.score-num{font-family:'Oswald',sans-serif;font-size:64px;font-weight:700;color:var(--an);line-height:1}
.score-num span{color:var(--am)}
.score-sub{font-size:12px;color:var(--ts);margin-top:4px;letter-spacing:.04em}

/* SCALE BAR */
.scale-wrap{position:relative;padding-top:28px;padding-bottom:20px}
.scale-bar{height:10px;background:linear-gradient(90deg,#E5E7EB 0%,#D1FAE5 50%,var(--am) 80%,#EF4444 100%);border-radius:5px;position:relative}
.scale-marker{position:absolute;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;background:var(--an);border:3px solid white;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.scale-label{position:absolute;top:-24px;transform:translateX(-50%);font-family:'Oswald',sans-serif;font-size:14px;font-weight:700;color:var(--an);white-space:nowrap;background:white;padding:2px 6px;border-radius:4px;border:1.5px solid var(--an)}
.scale-edges{display:flex;justify-content:space-between;margin-top:6px}
.scale-edge{font-size:11px;color:var(--ts);font-weight:600}
.scale-mid{font-size:11px;color:var(--ts);font-weight:600;position:absolute;left:50%;transform:translateX(-50%);margin-top:6px}

/* PROGRAMS TABLE */
.prog-table{width:100%;border-collapse:collapse;margin-top:4px}
.prog-table th{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ts);text-align:left;padding:0 8px 10px;border-bottom:1.5px solid var(--li)}
.prog-table th:last-child{text-align:right}
.prog-table td{font-size:13px;color:var(--an);padding:10px 8px;border-bottom:1px solid var(--li);line-height:1.4}
.prog-table tr:last-child td{border-bottom:none}
.prog-table .pts{font-family:'Oswald',sans-serif;font-size:16px;font-weight:700;color:var(--am);text-align:right;white-space:nowrap}

/* MODULES */
.mod-group{margin-bottom:20px}
.mod-group:last-child{margin-bottom:0}
.mod-group-label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ts);margin-bottom:10px}
.mod-chips{display:flex;flex-wrap:wrap;gap:8px}
.mod-chip{background:#F3F4F6;border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--an)}
.mod-chip.highlight{background:var(--am);color:var(--an)}

/* GAP CALCULATOR */
.gap-input-row{display:flex;gap:10px;margin-top:4px}
.gap-input-row input{flex:1;padding:12px 16px;border:1.5px solid var(--li);border-radius:10px;font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;color:var(--an);outline:none;transition:border-color .2s;text-align:center;min-width:0}
.gap-input-row input:focus{border-color:var(--az)}
.gap-input-row input::placeholder{color:#C5C7D4;font-weight:600}
.gap-btn{background:var(--an);color:white;font-family:'Montserrat',sans-serif;font-weight:700;font-size:13px;padding:12px 22px;border-radius:10px;border:none;cursor:pointer;transition:background .2s;white-space:nowrap;flex-shrink:0}
.gap-btn:hover{background:var(--az)}

.gap-result{margin-top:16px;border-radius:10px;padding:16px 20px;font-size:14px;font-weight:600;display:none}
.gap-result.show{display:block}
.gap-result.ok{background:#D1FAE5;color:#065F46}
.gap-result.close{background:#FEF3C7;color:#92400E}
.gap-result.far{background:#FEE2E2;color:#991B1B}
.gap-result .gap-num{font-family:'Oswald',sans-serif;font-size:28px;font-weight:700;display:block;margin-top:4px}

/* CTA SECTION */
.cta-section{background:var(--an);padding:60px 24px;text-align:center}
.cta-section .cta-label{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:12px}
.cta-section h2{font-family:'Oswald',sans-serif;font-size:clamp(22px,4vw,36px);font-weight:700;text-transform:uppercase;color:white;line-height:1.15;margin-bottom:10px}
.cta-section h2 em{color:var(--am);font-style:normal}
.cta-section p{font-size:14px;color:rgba(255,255,255,.65);max-width:440px;margin:0 auto 32px;line-height:1.65}
.wa-btn{display:inline-flex;align-items:center;gap:10px;background:var(--am);color:var(--an);font-family:'Montserrat',sans-serif;font-weight:800;font-size:14px;padding:16px 32px;border-radius:12px;text-decoration:none;transition:transform .2s,box-shadow .2s}
.wa-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,192,0,.4)}

/* NOTA */
.nota{font-size:11px;color:rgba(255,255,255,.35);margin-top:20px;line-height:1.6;max-width:440px;margin-left:auto;margin-right:auto}

/* ERROR STATE */
.error-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;text-align:center;gap:16px}
.error-wrap h2{font-family:'Oswald',sans-serif;font-size:28px;color:var(--an);text-transform:uppercase}
.error-wrap p{font-size:14px;color:var(--ts);max-width:360px;line-height:1.65}
.error-wrap a{color:var(--az);font-weight:700;text-decoration:none}

@media(max-width:500px){
  .gap-input-row{flex-direction:column}
  .prog-table th,.prog-table td{padding:8px 4px}
}
</style>
</head>

function fmt(n){return n.toLocaleString('es-MX')}

function scorePct(s){return Math.round((s-700)/600*100)}

function renderPage(){
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('fac');
  const fac = FACULTADES[slug];
  const content = document.getElementById('pageContent');

  if(!fac){
    content.innerHTML = `
      <div class="error-wrap">
        <h2>Facultad no encontrada</h2>
        <p>El enlace no es válido. Regresa a la lista de facultades y elige la tuya.</p>
        <a href="facultad.html">← Ir a facultades</a>
      </div>`;
    return;

  document.documentElement.style.setProperty('--area-color', fac.areaColor);

  const minScore = Math.min(...fac.programas.map(p=>p.score));
  const maxScore = Math.max(...fac.programas.map(p=>p.score));
  const hasMultiple = fac.programas.length > 1;
  const displayScore = hasMultiple ? minScore : fac.programas[0].score;
  const pct = scorePct(displayScore);
  const midPct = scorePct(1000);

  const progRows = fac.programas.map(p=>`
    <tr>
      <td>${p.nombre}</td>
      <td class="pts">${fmt(p.score)}</td>
    </tr>`).join('');

    <div class="card-title">Puntajes por carrera</div>
    <table class="prog-table">
      <thead><tr><th>Carrera</th><th>Puntaje mínimo</th></tr></thead>
      <tbody>${progRows}</tbody>
    </table>` : '';

  const baseChips = MODULOS_BASE.map(m=>`<span class="mod-chip">${m}</span>`).join('');
  const specChips = fac.modulos.map(m=>`<span class="mod-chip highlight">${m}</span>`).join('');

  const waMsg = encodeURIComponent(`Hola, me interesa un diagnóstico para ingresar a la Facultad de ${fac.nombre} de la UANL.`);

  content.innerHTML = `
    <div class="pg-header">
      <p class="paso">Paso 3 de 3 · EXANI-II · Facultad</p>
      <div class="area-chip"><span class="dot"></span>${fac.areaLabel}</div>
      <h1>Fac. de <em>${fac.nombre}</em></h1>
    </div>

    <main>

      <!-- PUNTAJE -->
      <div class="card">
        <div class="card-title">Puntaje mínimo de ingreso</div>
        <div class="score-hero">
          <div class="score-num">${hasMultiple?'desde ':''}<span>${fmt(displayScore)}</span></div>
          <div class="score-sub">puntos en escala 700–1,300</div>
        </div>
        <div class="scale-wrap">
          <div class="scale-bar">
            <div class="scale-marker" style="left:${pct}%">
              <div class="scale-label">${hasMultiple?'desde ':''} ${fmt(displayScore)}</div>
            </div>
          </div>
          <div class="scale-edges">
            <span class="scale-edge">700</span>
            <span class="scale-edge">1,000</span>
            <span class="scale-edge">1,300</span>
          </div>
        </div>
        ${progSection}
        ${fac.nota?`<p style="font-size:11px;color:var(--ts);margin-top:16px;line-height:1.6">⚠️ ${fac.nota}</p>`:''}
      </div>

      <!-- MÓDULOS -->
      <div class="card">
        <div class="card-title">Módulos que debes preparar</div>
        <div class="mod-group">
          <div class="mod-group-label">Base — todos los sustentantes (4 módulos)</div>
          <div class="mod-chips">${baseChips}</div>
        </div>
        <div class="mod-group">
          <div class="mod-group-label">Específicos de tu facultad (2 módulos)</div>
          <div class="mod-chips">${specChips}</div>
        </div>
        <p style="font-size:12px;color:var(--ts);margin-top:18px;line-height:1.65">
          El EXANI-II tiene <strong>168 reactivos</strong> en total (4 módulos base + 2 específicos + 30 de ensayo sin puntaje). Duración: <strong>4h 30min</strong>.
        </p>
      </div>

      <!-- CALCULADORA -->
      <div class="card">
        <div class="card-title">Calcula tu brecha</div>
        <p style="font-size:14px;color:var(--ts);margin-bottom:16px;line-height:1.65">
          ¿Tienes un resultado de simulacro? Ingresa tu puntaje y calcula cuánto te falta.
        </p>
        <div class="gap-input-row">
          <input type="number" id="myScore" min="700" max="1300" placeholder="Tu puntaje" />

function calcGap(cutoff){
  const val = parseInt(document.getElementById('myScore').value);
  const result = document.getElementById('gapResult');
  if(!val || val < 700 || val > 1300){
    result.className = 'gap-result show far';
    result.innerHTML = 'Ingresa un puntaje válido entre 700 y 1,300.';
    return;
  }
  const diff = cutoff - val;
  if(diff <= 0){
    result.className = 'gap-result show ok';
    result.innerHTML = `¡Ya tienes el puntaje mínimo!<span class="gap-num">+${fmt(Math.abs(diff))} pts de ventaja</span>Estás ${fmt(Math.abs(diff))} puntos por encima del mínimo requerido.`;
  } else if(diff <= 60){
    result.className = 'gap-result show close';
    result.innerHTML = `Estás muy cerca.<span class="gap-num">${fmt(diff)} pts de diferencia</span>Con un poco más de preparación en los módulos específicos puedes lograrlo.`;
  } else {
    result.className = 'gap-result show far';
    result.innerHTML = `Te faltan ${fmt(diff)} puntos.<span class="gap-num">${fmt(diff)} pts de diferencia</span>Nuestro diagnóstico gratuito te indica exactamente qué repasar para cerrar esa brecha.`;
  }
}
